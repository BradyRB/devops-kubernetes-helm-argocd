apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-gitops.fullname" . }}
  labels:
    {{- include "hello-gitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "hello-gitops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-gitops.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: page
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: {{ include "hello-gitops.fullname" . }}-page
