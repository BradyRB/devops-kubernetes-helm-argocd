apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-gitops.fullname" . }}-page
  labels:
    {{- include "hello-gitops.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>{{ .Values.page.title }}</title>
      <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1726;color:#eaf2ff;font-family:system-ui,Segoe UI,sans-serif}
      article{width:min(540px,88vw);background:#18263c;padding:40px;border:1px solid #3a526e;border-radius:20px}
      h1{font-size:30px;line-height:1.2}p{color:#bfd0e4}span{color:#67e4bf;font-weight:700;letter-spacing:.08em}
      </style>
    </head>
    <body><article><span>INTEC · LABORATORIO DEVOPS</span>
    <h1>{{ .Values.page.title }}</h1>
    <p>{{ .Values.page.message }}</p>
    <p>NGINX ejecutandose en Kubernetes, desplegado desde un Helm Chart.</p>
    </article></body></html>
